<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Paper</title>
<style>
/* ============ Design tokens ============ */
:root {
  --accent: #185abd;
  --accent-soft: rgba(24, 90, 189, .12);
  --accent-hover: #12499b;
  --bg: #f3f3f6;
  --surface: #ffffff;
  --chrome: #fafafc;
  --chrome-2: #f0f0f4;
  --border: #e5e7eb;
  --border-strong: #d1d5db;
  --text: #1d1d1f;
  --text-2: #6b7280;
  --text-3: #9ca3af;
  --danger: #dc2626;
  --ok: #16a34a;
  --radius-s: 5px;
  --radius-m: 7px;
  --radius-l: 11px;
  --ctrl-h: 28px;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --font-ui: -apple-system, "SF Text", "Inter", "Segoe UI", sans-serif;
  --font-doc: "Times New Roman", Times, serif;
  --shadow-page: 0 0 1px rgba(0,0,0,.18), 0 4px 14px rgba(0,0,0,.10), 0 14px 34px rgba(0,0,0,.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: var(--font-ui); background: var(--bg); color: var(--text); display: flex; flex-direction: column; overflow: hidden; -webkit-font-smoothing: antialiased; font-size: 12px; }
.hidden { display: none !important; }
button { font-family: inherit; }

/* ============ 1. Barre de titre ============ */
#topbar { background: var(--chrome); border-bottom: 1px solid var(--border); min-height: 46px; display: flex; align-items: center; gap: var(--space-3); padding: 6px 14px; flex-wrap: wrap; }
#titleZone { display: flex; align-items: center; gap: 8px; min-width: 220px; }
#docTitle { font-size: 13.5px; font-weight: 600; color: var(--text); outline: none; padding: 3px 8px; border-radius: var(--radius-s); min-width: 60px; max-width: 300px; white-space: nowrap; overflow: hidden; }
#docTitle:hover { background: var(--chrome-2); }
#docTitle:focus { background: #fff; box-shadow: 0 0 0 2px var(--accent-soft), 0 0 0 1px var(--accent); }
#saveStatus { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-3); white-space: nowrap; }
#saveStatus .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); }
#saveStatus.dirty .dot { background: #d97706; }
#saveStatus.dirty { color: #b45309; }
#saveStatus.saving .dot { background: var(--accent); animation: pulse 1s infinite; }
#saveStatus.saving { color: var(--accent); }
#saveStatus.clean .dot { background: var(--ok); }
#saveStatus.error .dot { background: var(--danger); }
#saveStatus.error { color: var(--danger); }
#saveRetry { display: none; font-size: 11px; border: 1px solid var(--border-strong); background: #fff; color: var(--danger); border-radius: var(--radius-s); padding: 2px 8px; cursor: pointer; }
#saveStatus.error #saveRetry { display: inline-block; }
@keyframes pulse { 50% { opacity: .35; } }

/* Tell Me */
#searchWrap { position: relative; flex: 1; display: flex; justify-content: center; min-width: 220px; }
#searchBox { width: min(360px, 100%); height: var(--ctrl-h); border: 1px solid var(--border-strong); border-radius: 999px; display: flex; align-items: center; gap: 6px; padding: 0 12px; background: #fff; }
#searchBox:focus-within { box-shadow: 0 0 0 3px var(--accent-soft); border-color: var(--accent); }
#searchBox svg { flex: none; color: var(--text-3); }
#searchInput { border: none; outline: none; flex: 1; font-size: 12px; background: transparent; }
#searchResults { position: absolute; top: 34px; width: min(400px, 96%); max-height: 320px; overflow: auto; background: #fff; border: 1px solid var(--border); border-radius: var(--radius-l); box-shadow: 0 10px 32px rgba(0,0,0,.16); z-index: 90; padding: 4px; }
.search-item { padding: 7px 10px; border-radius: var(--radius-s); cursor: pointer; display: flex; justify-content: space-between; gap: 10px; }
.search-item:hover, .search-item.selected { background: var(--accent-soft); }
.search-item .lbl { font-size: 12px; color: var(--text); }
.search-item .cat { font-size: 11px; color: var(--text-3); }
.search-empty { padding: 10px; color: var(--text-3); font-size: 12px; }

/* Accès rapide */
#quickbar { display: flex; align-items: center; gap: 2px; }
.qbtn { height: 30px; min-width: 30px; padding: 0 8px; display: inline-flex; align-items: center; gap: 6px; background: transparent; border: none; border-radius: var(--radius-m); color: var(--text-2); cursor: pointer; font-size: 12px; }
.qbtn:hover { background: var(--chrome-2); color: var(--text); }
.qbtn:disabled { opacity: .38; cursor: default; }
.qbtn:disabled:hover { background: transparent; color: var(--text-2); }
.qbtn.save { color: var(--accent); font-weight: 600; }
#quickbar .sep { width: 1px; height: 18px; background: var(--border); margin: 0 4px; }

/* ============ 2. Ruban ============ */
#ribbon { background: var(--chrome); border-bottom: 1px solid var(--border); }
#tabs { display: flex; gap: 1px; padding: 4px 10px 0; }
.tab { border: none; background: transparent; padding: 6px 14px 8px; font-size: 12.5px; color: var(--text-2); cursor: pointer; border-radius: var(--radius-m) var(--radius-m) 0 0; }
.tab:hover { color: var(--text); background: var(--chrome-2); }
.tab.active { color: var(--accent); font-weight: 600; background: var(--surface); box-shadow: 0 -1px 0 var(--border), 1px 0 0 var(--border), -1px 0 0 var(--border); }
#panes { background: var(--surface); border-top: 1px solid var(--border); padding: 5px 10px 4px; }
.tabpane { display: flex; align-items: stretch; gap: 0; min-height: 78px; }
.group { display: flex; flex-direction: column; justify-content: space-between; padding: 0 10px; min-width: 0; }
.group + .group { border-left: 1px solid var(--border); }
.group-controls { display: flex; align-items: center; gap: 3px; flex-wrap: wrap; }
.group-label { font-size: 10px; color: var(--text-3); text-align: center; padding-top: 4px; user-select: none; letter-spacing: .2px; }
.rbtn { height: var(--ctrl-h); min-width: var(--ctrl-h); padding: 0 7px; background: transparent; border: 1px solid transparent; border-radius: var(--radius-m); color: var(--text); cursor: pointer; display: inline-flex; align-items: center; gap: 5px; font-size: 12px; }
.rbtn:hover { background: var(--chrome-2); border-color: var(--border); }
.rbtn:disabled { opacity: .35; cursor: default; }
.rbtn:disabled:hover { background: transparent; border-color: transparent; }
.rbtn.active { background: var(--accent-soft); border-color: rgba(24,90,189,.4); color: var(--accent); }
.rbtn .grow { font-size: 12.5px; }
.rbtn.wide { padding: 0 10px; }
#panes select { height: var(--ctrl-h); border: 1px solid var(--border-strong); border-radius: var(--radius-s); background: #fff; font-size: 12px; padding: 0 4px; max-width: 118px; color: var(--text); }
#panes select:hover { border-color: var(--text-3); }
.stepper { display: inline-flex; border: 1px solid var(--border-strong); border-radius: var(--radius-s); overflow: hidden; }
.stepper button { width: 24px; height: 26px; border: none; background: #fff; cursor: pointer; color: var(--text-2); font-size: 10px; }
.stepper button:hover { background: var(--chrome-2); color: var(--text); }
#styleGallery { display: flex; gap: 4px; }
.style-thumb { width: 62px; height: 48px; border: 1px solid var(--border-strong); border-radius: var(--radius-s); background: #fff; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.style-thumb:hover { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.style-thumb .demo { line-height: 1; color: var(--text); }
.style-thumb .name { font-size: 9.5px; color: var(--text-3); }
#pane-file .group-controls { gap: 10px; padding: 6px 4px; }
.ftile { display: flex; flex-direction: column; align-items: center; gap: 5px; width: 76px; padding: 10px 4px; background: #fff; border: 1px solid var(--border); border-radius: var(--radius-m); cursor: pointer; color: var(--text-2); font-size: 11.5px; }
.ftile:hover { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.ftile svg { display: block; }

/* ============ 3. Zone de travail ============ */
#work { flex: 1; min-height: 0; overflow: auto; background: var(--bg); display: flex; }
#work.no-outline #sidebar { display: none; }
#sidebar { width: 220px; background: var(--chrome); border-right: 1px solid var(--border); overflow-y: auto; padding: 10px 0 14px; flex: none; }
.sb-title { font-size: 10px; text-transform: uppercase; letter-spacing: .5px; color: var(--text-3); font-weight: 700; padding: 2px 14px 8px; }
.ol-item { padding: 5px 14px; font-size: 12px; color: var(--text); cursor: pointer; border-left: 2.5px solid transparent; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ol-item:hover { background: var(--chrome-2); border-left-color: var(--accent); }
.ol-h1 { font-weight: 600; } .ol-h2 { padding-left: 28px; color: var(--text-2); } .ol-h3 { padding-left: 42px; color: var(--text-3); }
.ol-empty { padding: 8px 14px; font-size: 11.5px; color: var(--text-3); line-height: 1.5; }
#sheet { margin: 14px auto 60px; flex: 1; }
#hruler { position: relative; height: 22px; margin-left: 22px; user-select: none; }
#rulerCanvas { position: relative; height: 100%; background: #fbfbfd; border: 1px solid var(--border); border-radius: 2px; overflow: hidden; }
.rtick { position: absolute; bottom: 0; width: 1px; height: 5px; background: var(--text-3); }
.rtick.major { height: 10px; background: var(--text-2); }
.rlabel { position: absolute; bottom: 10px; font-size: 8.5px; color: var(--text-3); transform: translateX(-50%); }
.rhandle { position: absolute; top: 1px; width: 8px; height: 16px; background: var(--chrome-2); border: 1px solid var(--border-strong); border-radius: 2px; cursor: ew-resize; z-index: 5; }
.rhandle:hover, .rhandle.drag { background: var(--accent-soft); border-color: var(--accent); }
.rhandle .grip { position: absolute; left: 2px; top: 3px; width: 2px; height: 9px; background: var(--text-3); }
.rhandle.indent .grip { background: transparent; width: 0; height: 0; border-left: 3px solid transparent; border-right: 3px solid transparent; border-bottom: 4px solid var(--text-3); left: 0; top: 8px; }
#pageRow { display: flex; align-items: flex-start; }
#vruler { position: relative; width: 22px; flex: none; user-select: none; }
.vtick { position: absolute; right: 0; height: 1px; width: 5px; background: var(--text-3); }
.vtick.major { width: 10px; background: var(--text-2); }
.vlabel { position: absolute; right: 11px; font-size: 8.5px; color: var(--text-3); transform: translateY(-50%); }
#page { position: relative; background: #fff; width: 794px; min-height: 1123px; padding: 94px 94px; outline: none; font-family: var(--font-doc); font-size: 12pt; line-height: 1.45; color: #111; box-shadow: var(--shadow-page); border-radius: 1px; }
body.web-mode #page { width: 100%; min-height: auto; }
#page p { margin: 0 0 10px; }
#page h1 { font-size: 28pt; margin: 14pt 0 8pt; line-height: 1.2; color: #1d1d1f; }
#page h2 { font-size: 20pt; margin: 12pt 0 7pt; line-height: 1.2; }
#page h3 { font-size: 15pt; margin: 10pt 0 6pt; line-height: 1.2; }
#page blockquote { border-left: 3px solid var(--accent); background: #f5f7fa; padding: 8px 12px; color: #444; margin: 8px 0; border-radius: 0 5px 5px 0; }
#page pre { font-family: Menlo, monospace; background: #f4f4f6; padding: 8px; border-radius: 6px; margin: 8px 0; white-space: pre-wrap; }
#page ul, #page ol { padding-left: 26px; margin: 0 0 10px; }
#page table { border-collapse: collapse; margin: 10px 0; width: 100%; }
#page td, #page th { border: 1px solid #999; padding: 5px 8px; min-width: 40px; }
#page th { background: #eef0f4; font-weight: 700; }
#page img { max-width: 100%; }
#page hr { border: none; border-top: 1px solid #aaa; margin: 14px 0; }
#page a { color: var(--accent); }
body.show-marks #page p::after { content: "¶"; color: #c3c3cb; font-size: 11pt; }
#pageOverlay { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
.page-boundary { position: absolute; left: 8px; right: 8px; height: 0; border-top: 1px dashed #c9ccd4; }
.page-boundary::after { content: attr(data-label); position: absolute; right: 4px; top: -14px; font-size: 9px; color: var(--text-3); font-family: var(--font-ui); }

/* ============ 4. Barre d'état ============ */
#statusbar { background: var(--chrome); border-top: 1px solid var(--border); padding: 4px 14px; display: flex; align-items: center; gap: var(--space-4); font-size: 11.5px; color: var(--text-2); flex-wrap: wrap; }
#statusbar .left { display: flex; gap: var(--space-4); align-items: center; }
#statusbar .spacer { flex: 1; }
#statusbar .right { display: flex; gap: var(--space-3); align-items: center; }
.stbtn { border: none; background: transparent; color: var(--text-2); font-size: 11.5px; cursor: pointer; padding: 2px 8px; border-radius: var(--radius-s); }
.stbtn:hover { background: var(--chrome-2); color: var(--text); }
.stbtn.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
#wordCount { cursor: pointer; border-radius: var(--radius-s); padding: 2px 6px; }
#wordCount:hover { background: var(--chrome-2); }
#langSel { height: 20px; font-size: 11px; border: 1px solid var(--border-strong); border-radius: var(--radius-s); background: #fff; color: var(--text-2); }
#zoomRange { width: 110px; accent-color: var(--accent); }

/* Tableaux contextuels */
#tablebar { display: none; gap: 5px; padding: 5px 14px; background: #eef3fc; border-bottom: 1px solid #d5ddec; align-items: center; flex-wrap: wrap; }
#tablebar.visible { display: flex; }
#tablebar span.lbl { font-size: 10.5px; color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: .4px; }
#tablebar button { height: 24px; padding: 0 9px; font-size: 11.5px; border: 1px solid #b9c6e0; border-radius: var(--radius-s); background: #fff; color: #24466e; cursor: pointer; }
#tablebar button:hover { background: #dce6f8; }
#tablebar button.danger { color: var(--danger); border-color: #ddb9b9; }
#tablebar button.danger:hover { background: #f7dede; }

/* Recherche flottante */
#findbar { display: none; position: fixed; top: 60px; right: 16px; z-index: 60; gap: 6px; padding: 9px 11px; background: rgba(255,255,255,.98); border: 1px solid var(--border-strong); border-radius: var(--radius-l); box-shadow: 0 8px 28px rgba(0,0,0,.16); align-items: center; }
#findbar.visible { display: flex; }
#findbar input { height: 26px; border: 1px solid var(--border-strong); border-radius: var(--radius-s); padding: 0 7px; width: 158px; font-size: 12px; outline: none; }
#findbar input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
#findbar button { height: 26px; padding: 0 9px; font-size: 11.5px; border: 1px solid var(--border-strong); border-radius: var(--radius-s); background: #fff; color: var(--text-2); cursor: pointer; }
#findbar button:hover { background: var(--chrome-2); color: var(--text); }
#findbar button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }

/* Popovers */
.popover { position: fixed; z-index: 80; background: #fff; border: 1px solid var(--border); border-radius: var(--radius-l); box-shadow: 0 12px 34px rgba(0,0,0,.18); padding: 10px; }
.sw-grid { display: grid; grid-template-columns: repeat(7, 22px); gap: 5px; }
.sw { width: 22px; height: 22px; border-radius: 4px; border: 1px solid rgba(0,0,0,.12); cursor: pointer; }
.sw:hover { transform: scale(1.12); box-shadow: 0 0 0 2px var(--accent-soft); }
.pop-title { font-size: 10px; color: var(--text-3); text-transform: uppercase; letter-spacing: .4px; margin: 6px 0; font-weight: 700; }
.pop-more { width: 100%; margin-top: 8px; height: 24px; font-size: 11.5px; border: 1px solid var(--border-strong); border-radius: var(--radius-s); background: var(--chrome); color: var(--text-2); cursor: pointer; }
.pop-more:hover { background: var(--chrome-2); color: var(--text); }

/* Dialogs */
#overlay { position: fixed; inset: 0; background: rgba(20,24,34,.42); display: flex; align-items: center; justify-content: center; z-index: 100; }
#overlay.hidden { display: none; }
#dialog { background: #fff; border-radius: var(--radius-l); padding: 20px 22px; width: 470px; max-width: 92vw; max-height: 72vh; overflow: auto; box-shadow: 0 18px 50px rgba(0,0,0,.32); }
#dialog h3 { font-size: 14.5px; margin-bottom: 13px; color: var(--text); }
.sym-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
.sym { height: 34px; font-size: 16px; border: 1px solid var(--border); border-radius: var(--radius-s); background: #fff; cursor: pointer; }
.sym:hover { background: var(--accent-soft); border-color: var(--accent); }
.keys { border-collapse: collapse; width: 100%; }
.keys td { padding: 5px 10px 5px 0; font-size: 12px; color: var(--text-2); border-bottom: 1px solid #f0f0f4; }
.keys td:first-child { font-weight: 600; color: var(--accent); white-space: nowrap; width: 150px; }
.stat-row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid #f0f0f4; font-size: 12.5px; color: var(--text-2); }
.stat-row b { color: var(--text); }
.dlg-close { margin-top: 16px; height: 29px; padding: 0 18px; font-size: 12px; border: 1px solid var(--border-strong); border-radius: var(--radius-m); background: var(--chrome); color: var(--text-2); cursor: pointer; }
.dlg-close:hover { background: var(--chrome-2); color: var(--text); }

/* Mode export PDF */
body.pdf-mode { background: #fff; }
body.pdf-mode #topbar, body.pdf-mode #ribbon, body.pdf-mode #tablebar, body.pdf-mode #findbar, body.pdf-mode #statusbar, body.pdf-mode #sidebar, body.pdf-mode #hruler, body.pdf-mode #vruler, body.pdf-mode #pageOverlay { display: none !important; }
body.pdf-mode #work { display: block; overflow: visible; }
body.pdf-mode #sheet { margin: 0; }
body.pdf-mode #page { box-shadow: none; }
</style>
</head>
<body class="show-outline">

<!-- ============ 1. Barre de titre ============ -->
<div id="topbar">
  <div id="titleZone">
    <span id="docTitle" contenteditable="true" spellcheck="false">Document sans nom</span>
    <span id="saveStatus" class="clean"><span class="dot"></span><span id="saveLabel">Enregistré</span><button id="saveRetry" onclick="requestSave()">Réessayer</button></span>
  </div>
  <div id="searchWrap">
    <div id="searchBox">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
      <input id="searchInput" placeholder="Rechercher une commande ou une action…" autocomplete="off">
    </div>
    <div id="searchResults" class="hidden"></div>
  </div>
  <div id="quickbar">
    <button class="qbtn" title="Nouveau (Cmd+N)" onclick="newDoc()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></button>
    <button class="qbtn" title="Ouvrir (Cmd+O)" onclick="native({type:'open'})"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg></button>
    <button class="qbtn save" id="qSave" title="Enregistrer (Cmd+S)" onclick="requestSave()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg><span>Enregistrer</span></button>
    <span class="sep"></span>
    <button class="qbtn" id="qUndo" title="Annuler (Cmd+Z)" onclick="cmd('undo')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg></button>
    <button class="qbtn" id="qRedo" title="Rétablir (Cmd+Maj+Z)" onclick="cmd('redo')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 14 20 9 15 4"/><path d="M4 20v-7a4 4 0 0 1 4-4h12"/></svg></button>
  </div>
</div>

<!-- ============ 2. Ruban ============ -->
<div id="ribbon">
  <div id="tabs">
    <button class="tab" data-tab="file">Fichier</button>
    <button class="tab active" data-tab="home">Accueil</button>
    <button class="tab" data-tab="insert">Insertion</button>
    <button class="tab" data-tab="layout">Mise en page</button>
    <button class="tab" data-tab="review">Révision</button>
    <button class="tab" data-tab="view">Affichage</button>
  </div>
  <div id="panes">

    <div class="tabpane hidden" id="pane-file">
      <div class="group" style="border-left:none">
        <div class="group-controls">

<script>
/* ================= Base ================= */
var page = document.getElementById('page');
var findbar = document.getElementById('findbar');
var savedRange = null;
var savedZoom = '1';
var ZOOMS = [0.5, 0.75, 1, 1.25, 1.5, 2];
var plainPaste = false;
var painter = null;
var currentMargins = 94;
var landscape = false;

function native(obj) {
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.app) {
    window.webkit.messageHandlers.app.postMessage(obj);
  }
}

/* ================= Machine à états de sauvegarde =================
   clean -> dirty (édition) ; dirty|error -> saving (Cmd+S) ;
   saving -> clean (panneau OK) ; saving -> dirty (annulation) ;
   saving -> error (échec) ; error -> saving (réessai).             */
var saveState = 'clean';
var wasDirtyBeforeSave = false;

function setSaveState(s) {
  saveState = s;
  var el = document.getElementById('saveStatus');
  var label = document.getElementById('saveLabel');
  el.className = s;
  if (s === 'clean') { label.textContent = 'Enregistré'; native({ type: 'dirty', value: false }); }
  if (s === 'dirty') { label.textContent = 'Modifié'; native({ type: 'dirty', value: true }); }
  if (s === 'saving') { label.textContent = 'Enregistrement…'; native({ type: 'dirty', value: true }); }
  if (s === 'error') { label.textContent = 'Erreur d\'enregistrement'; native({ type: 'dirty', value: true }); }
  syncQuickbar();
}
function markDirty() { if (saveState === 'clean') setSaveState('dirty'); }

function afterSave() {
  try { localStorage.removeItem('paper.autosave'); } catch (e) {}
  setSaveState('clean');
  hintFlash('Document enregistré.');
  refresh();
}
function saveCancelled() { setSaveState(wasDirtyBeforeSave ? 'dirty' : 'clean'); }
function saveError() { setSaveState('error'); }

/* Autosauvegarde locale (debounce 2 s) */
var autosaveTimer = null;
function scheduleAutosave() {
  if (autosaveTimer) clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(function () {
    try { localStorage.setItem('paper.autosave', page.innerHTML); } catch (e) {}
  }, 2000);
}

/* Protection avant fermeture */
window.addEventListener('beforeunload', function (e) {
  if (saveState !== 'clean') { e.preventDefault(); e.returnValue = ''; }
});

/* Cmd+S / Ctrl+S centralisé */
document.addEventListener('keydown', function (e) {
  if ((e.metaKey || e.ctrlKey) && (e.key === 's' || e.key === 'S')) {
    e.preventDefault();
    if (saveState === 'dirty' || saveState === 'error') requestSave();
  }
});

/* ================= Titre éditable ================= */
var titleEl = document.getElementById('docTitle');
var renameTimer = null;
titleEl.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' || e.key === 'Escape') { e.preventDefault(); titleEl.blur(); }
});
titleEl.addEventListener('input', function () {
  if (renameTimer) clearTimeout(renameTimer);
  renameTimer = setTimeout(function () {
    var name = titleEl.textContent.trim() || 'Document sans nom';
    native({ type: 'rename', name: name });
  }, 400);
});
function setDocTitle(name) { if (titleEl.textContent !== name) titleEl.textContent = name; }

/* ================= Tell Me (recherche de commandes) ================= */
var COMMANDS = [];
function reg(label, cat, fn) { COMMANDS.push({ label: label, cat: cat, fn: fn }); }
function registerCommands() {
  reg('Nouveau document', 'Fichier', function () { newDoc(); });
  reg('Ouvrir un document', 'Fichier', function () { native({ type: 'open' }); });
  reg('Enregistrer', 'Fichier', function () { requestSave(); });
  reg('Imprimer', 'Fichier', function () { native({ type: 'print' }); });
  reg('Gras', 'Accueil', function () { cmd('bold'); });
  reg('Italique', 'Accueil', function () { cmd('italic'); });
  reg('Souligné', 'Accueil', function () { cmd('underline'); });
  reg('Barré', 'Accueil', function () { cmd('strikeThrough'); });
  reg('Indice', 'Accueil', function () { cmd('subscript'); });
  reg('Exposant', 'Accueil', function () { cmd('superscript'); });
  reg('Modifier la casse', 'Accueil', function () { cycleCase(); });
  reg('Reproduire la mise en forme', 'Accueil', function () { togglePainter(); });
  reg('Liste à puces', 'Accueil', function () { cmd('insertUnorderedList'); });
  reg('Liste numérotée', 'Accueil', function () { cmd('insertOrderedList'); });
  reg('Justifier', 'Accueil', function () { cmd('justifyFull'); });
  reg('Centrer', 'Accueil', function () { cmd('justifyCenter'); });
  reg('Interligne normal', 'Accueil', function () { setLineHeight('1.45'); });
  reg('Afficher les marques de format', 'Accueil', function () { toggleMarks(); });
  reg('Style Titre 1', 'Accueil', function () { applyBlock('h1'); });
  reg('Style Titre 2', 'Accueil', function () { applyBlock('h2'); });
  reg('Style Citation', 'Accueil', function () { applyBlock('blockquote'); });
  reg('Rechercher dans le document', 'Édition', function () { toggleFind(true); });
  reg('Remplacer', 'Édition', function () { toggleFind(true); setTimeout(function () { document.getElementById('replaceInput').focus(); }, 60); });
  reg('Tout sélectionner', 'Édition', function () { cmd('selectAll'); });
  reg('Insérer un lien', 'Insertion', function () { inser  reg('Insérer une image', 'Insertion', function () { native({ type: 'image' }); });
  reg('Insérer un tableau', 'Insertion', function () { insertTable(); });
  reg('Caractères spéciaux', 'Insertion', function () { openDialog('symbols'); });
  reg('Insérer la date', 'Insertion', function () { insertDate(); });
  reg('Page de garde', 'Insertion', function () { insertCover(); });
  reg('Ligne horizontale', 'Insertion', function () { cmd('insertHorizontalRule'); });
  reg('Marges normales', 'Mise en page', function () { setMargins(94); });
  reg('Marges étroites', 'Mise en page', function () { setMargins(48); });
  reg('Marges larges', 'Mise en page', function () { setMargins(140); });
  reg('Orientation paysage', 'Mise en page', function () { toggleOrientation(); });
  reg('Couleur de page', 'Mise en page', function () { openColorPop('page'); });
  reg('Correcteur orthographique', 'Révision', function () { toggleSpell(); });
  reg('Statistiques du document', 'Révision', function () { openDialog('stats'); });
  reg('Raccourcis clavier', 'Aide', function () { openDialog('shortcuts'); });
  reg('Plan du document', 'Affichage', function () { toggleOutline(); });
  reg('Mode Web', 'Affichage', function () { setViewMode('web'); });
  reg('Mode Page', 'Affichage', function () { setViewMode('page'); });
  reg('Zoom 100 %', 'Affichage', function () { zoomReset(); });
  reg('Zoom avant', 'Affichage', function () { zoomIn(); });
  reg('Zoom arrière', 'Affichage', function () { zoomOut(); });
}

var searchInput = document.getElementById('searchInput');
var searchResults = document.getElementById('searchResults');
var searchSel = 0;
searchInput.addEventListener('input', renderSearch);
searchInput.addEventListener('keydown', function (e) {
  var items = searchResults.querySelectorAll('.search-item');
  if (e.key === 'ArrowDown') { e.preventDefault(); searchSel = Math.min(searchSel + 1, items.length - 1); highlightSearch(items); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); searchSel = Math.max(searchSel - 1, 0); highlightSearch(items); }
  else if (e.key === 'Enter') { e.preventDefault(); if (items[searchSel]) items[searchSel].click(); }
  else if (e.key === 'Escape') { e.preventDefault(); closeSearch(); searchInput.blur(); }
});
searchInput.addEventListener('focus', renderSearch);
document.addEventListener('mousedown', function (e) {
  if (!document.getElementById('searchWrap').contains(e.target)) closeSearch();
});
function renderSearch() {
  var q = searchInput.value.trim().toLowerCase();
  var matches = !q ? COMMANDS.slice(0, 8)
    : COMMANDS.filter(function (c) { return (c.label + ' ' + c.cat).toLowerCase().indexOf(q) !== -1; }).slice(0, 10);
  searchSel = 0;
  if (!matches.length) {
    searchResults.innerHTML = '<div class="search-empty">Aucune commande trouvée.</div>';
  } else {
    searchResults.innerHTML = matches.map(function (c, i) {
      return '<div class="search-item' + (i === 0 ? ' selected' : '') + '" data-i="' + i + '"><span class="lbl">' + c.label + '</span><span class="cat">' + c.cat + '</span></div>';
    }).join('');
    searchResults.querySelectorAll('.search-item').forEach(function (el) {
      el.onmousedown = function (ev) { ev.preventDefault(); matches[parseInt(el.getAttribute('data-i'), 10)].fn(); closeSearch(); };
    });
  }
  searchResults.classList.remove('hidden');
}
function highlightSearch(items) { items.forEach(function (el, i) { el.classList.toggle('selected', i === searchSel); }); }
function closeSearch() { searchResults.classList.add('hidden'); searchInput.value = ''; }

/* ================= Onglets ================= */
document.querySelectorAll('#tabs .tab').forEach(function (t) {
  t.addEventListener('mousedown', function (e) { e.preventDefault(); });
  t.addEventListener('click', function () {
    document.querySelectorAll('#tabs .tab').forEach(function (x) { x.classList.remove('active'); });
    t.classList.add('active');
    document.querySelectorAll('.tabpane').forEach(function (p) { p.classList.add('hidden'); });
    document.getElementById('pane-' + t.getAttribute('data-tab')).classList.remove('hidden');
  });
});

/* ================= Commandes d'édition ================= */
function cmd(c, v) {
  page.focus();
  document.execCommand(c, false, (v === undefined ? null : v));
  refresh();
}
function refresh() {
  syncRibbon();
  syncTableBar();
  refreshCounts();
  buildOutline();
  drawPageBoundaries();
  updatePageInfo();
}
document.addEventListener('selectionchange', function () {
  var s = window.getSelection();
  if (s.rangeCount > 0 && page.contains(s.getRangeAt(0).commonAncestorContainer)) {
    savedRange = s.getRangeAt(0).cloneRange();
  }
  syncRibbon();
  syncTableBar();
  updatePageInfo();
});
document.querySelectorAll('#ribbon button, #tablebar button, #tabs .tab').forEach(function (b) {
  b.addEventListener('mousedown', function (e) { e.preventDefault(); });
});
function restoreSelection() {
  page.focus();
  if (savedRange) {
    var s = window.getSelection();
    s.removeAllRanges();
    s.addRange(savedRange);
  }
}
function state(c) { try { return document.queryCommandState(c); } catch (e) { return false; } }
function enabled(c) { try { return document.queryCommandEnabled(c); } catch (e) { return false; } }

/* Synchronisation bidirectionnelle ruban <-> document */
function syncRibbon() {
  document.querySelectorAll('#ribbon button[data-cmd]').forEach(function (b) {
    b.classList.toggle('active', state(b.getAttribute('data-cmd')));
  });
  var sel = window.getSelection();
  var hasSelection = sel && !sel.isCollapsed && sel.toString().length > 0;
  var btnCut = document.getElementById('btnCut');
  var btnCopy = document.getElementById('btnCopy');
  if (btnCut) btnCut.disabled = !hasSelection;
  if (btnCopy) btnCopy.disabled = !hasSelection;
  var qUndo = document.getElementById('qUndo');
  var qRedo = document.getElementById('qRedo');
  if (qUndo) qUndo.disabled = !enabled('undo');
  if (qRedo) qRedo.disabled = !enabled('redo');
  syncQuickbar();
  var st = caretStyle();
  var fontSel = document.getElementById('fontSel');
  if (fontSel.querySelector('option[value="' + st.font + '"]')) fontSel.value = st.font;
  var pt = Math.round(st.size * 0.75);
  var sizeSel = document.getElementById('sizeSel');
  if (sizeSel.querySelector('option[value="' + pt + '"]')) sizeSel.value = String(pt);
  var fore = caretColor();
  var mini = document.getElementById('foreSwatchMini');
  if (mini && fore) mini.style.background = fore;
}
function syncQuickbar() {
  var qSave = document.getElementById('qSave');
  if (qSave) qSave.disabled = (saveState === 'clean' || saveState === 'saving');
}
function caretStyle() {
  var sel = window.getSelection();
  var node = sel && sel.anchorNode;
  var el = node ? (node.nodeType === 1 ? node : node.parentNode) : page;
  if (!el || !page.contains(el) || el === page) {
    var p = page.querySelector('p, h1, h2, h3');
    el = p || page;
  }
  var cs = getComputedStyle(el);
  return { font: (cs.fontFamily.split(',')[0] || 'Times New Roman').replace(/["']/g, '').trim(), size: parseFloat(cs.fontSize) || 16 };
}
function caretColor() {
  var sel = window.getSelection();
  var node = sel && sel.anchorNode;
  var el = node ? (node.nodeType === 1 ? node : node.parentNode) : page;
  if (!el || !page.contains(el)) el = page;
  return getComputedStyle(el).color;
}

/* ================= Compteurs et messages ================= */
function refreshCounts() {
  var t = page.innerText.replace(/\u00a0/g, ' ').trim();
  var words = t ? t.split(/\s+/).length : 0;
  document.getElementById('wordCount').textContent = words + (words > 1 ? ' mots' : ' mot');
}
function hintFlash(msg) {
  var el = document.getElementById('saveLabel');
  el.textContent = msg;
  setTimeout(function () { document.getElementById('saveLabel').textContent = saveStateLabel(); }, 2500);
}
function saveStateLabel() {
  if (saveState === 'clean') return 'Enregistré';
  if (saveState === 'dirty') return 'Modifié';
  if (saveState === 'saving') return 'Enregistrement…';
  return 'Erreur d\'enregistrement';
}

page.addEventListener('input', function () {
  markDirty();
  scheduleAutosave();
  refresh();
});

function newDoc() {
  if (saveState !== 'clean' && !window.confirm('Le document contient des modifications non enregistrées. Continuer sans enregistrer ?')) return;
  page.innerHTML = '<p><br></p>';
  try { localStorage.removeItem('paper.autosave'); } catch (e) {}
  native({ type: 'new' });
  setSaveState('clean');
  setDocTitle('Document sans nom');
  refresh();
}
function openHTML(html) {
  var doc = new DOMParser().parseFromString(html, 'text/html');
  page.innerHTML = doc.body.innerHTML || '<p><br></p>';
  try { localStorage.removeItem('paper.autosave'); } catch (e) {}
  setSaveState('clean');
  refresh();
}
try {
  var backup = localStorage.getItem('paper.autosave');
  if (backup && backup.replace(/<[^>]*>/g, '').replace(/&nbsp;/g, ' ').trim() !== '') {
    if (window.confirm('Une version non enregistrée de votre dernier document a été retrouvée. La restaurer ?')) {
      page.innerHTML = backup;
      setSaveState('dirty');
    } else {
      localStorage.removeItem('paper.autosave');
    }
  }
} catch (e) {}

/* ================= Collage sans mise en forme ================= */
document.addEventListener('paste', function (e) {
  if (!plainPaste) return;
  e.preventDefault();
  var text = (e.clipboardData || window.clipboardData).getData('text/plain');
  document.execCommand('insertText', false, text);
  plainPaste = false;
  hintFlash('Collage sans mise en forme effectué.');
  refresh();
});
function pastePlain() {
  plainPaste = true;
  page.focus();
  hintFlash('Mode texte seul : collez avec Cmd+V.');
}

/* ================= Police : taille, casse, pinceau ================= */
function setFontSize(size) {
  restoreSelection();
  document.execCommand('fontSize', false, '7');
  var fonts = page.querySelectorAll('font[size="7"]');
  for (var i = 0; i < fonts.length; i++) {
    var f = fonts[i];
    var span = document.createElement('span');
    span.style.fontSize = size + 'pt';
    while (f.firstChild) span.appendChild(f.firstChild);
    f.parentNode.replaceWith(span, f);
  }
  markDirty();
}
function stepSize(dir) {
  var st = caretStyle();
  var pt = Math.round(st.size * 0.75);
  var steps = [8, 10, 11, 12, 14, 16, 18, 24, 36, 48, 72];
  var idx = 0;
  for (var i = 0; i < steps.length; i++) { if (Math.abs(steps[i] - pt) < 2) { idx = i; break; } }
  idx = Math.max(0, Math.min(steps.length - 1, idx + dir));
  setFontSize(steps[idx]);
  document.getElementById('sizeSel').value = String(steps[idx]);
}
function cycleCase() {
  var sel = window.getSelection().toString();
  if (!sel) { hintFlash('Sélectionnez du texte pour changer la casse.'); return; }
  restoreSelection();
  var upper = sel === sel.toUpperCase();
  var lower = sel === sel.toLowerCase();
  var next = (!upper && !lower) ? sel.toUpperCase() : (upper ? sel.toLowerCase() : sel.replace(/\b\w/g, function (c) { return c.toUpperCase(); }));
  document.execCommand('insertText', false, next);
  markDirty();
  refresh();
}
function togglePainter() {
  if (painter) {
    painter = null;
    document.getElementById('btnPaint').classList.remove('active');
    return;
  }
  var sel = window.getSelection();
  if (!sel.rangeCount || sel.isCollapsed) { hintFlash('Sélectionnez un texte modèle d\'abord.'); return; }
  var node = sel.anchorNode;
  var el = node.nodeType === 1 ? node : node.parentNode;
  var cs = getComputedStyle(el);
  painter = {
    bold: cs.fontWeight >= 600 || cs.fontWeight === 'bold',
    italic: cs.fontStyle !== 'normal',
    underline: cs.textDecoration.indexOf('underline') !== -1,
    strike: cs.textDecoration.indexOf('line-through') !== -1,
    color: cs.color,
    size: Math.round(parseFloat(cs.fontSize) * 0.75) + 'pt',
    font: cs.fontFamily.split(',')[0].replace(/["']/g, '').trim()
  };
  document.getElementById('btnPaint').classList.add('active');
  hintFlash('Sélectionnez le texte à mettre en forme.');
}
document.addEventListener('mouseup', function () {
  if (!painter) return;
  var sel = window.getSelection();
  if (sel.isCollapsed) return;
  restoreSelection();
  if (painter.bold) cmd('bold');
  if (painter.italic) cmd('italic');
  if (painter.underline) cmd('underline');
  if (painter.strike) cmd('strikeThrough');
  cmd('fontName', painter.font);
  document.execCommand('fontSize', false, '7');
  page.querySelectorAll('font[size="7"]').forEach(function (f) {
    var span = document.createElement('span');
    span.style.fontSize = painter.size;
    while (f.firstChild) span.appendChild(f.firstChild);
    f.parentNode.replaceWith(span, f);
  });
  document.execCommand('foreColor', false, painter.color);
  painter = null;
  document.getElementById('btnPaint').classList.remove('active');
  markDirty();
  refresh();
});

/* ================= Couleurs : popovers ================= */
var PALETTE = ['#000000','#444444','#666666','#888888','#aaaaaa','#cccccc','#eeeeee','#ffffff',
               '#7f1d1d','#dc2626','#ea580c','#d97706','#ca8a04','#65a30d','#16a34a','#059669',
               '#0891b2','#0284c7','#185abd','#4f46e5','#7c3aed','#c026d3','#db2777','#e11d48'];
var popTarget = 'fore';
var recentColors = [];
function openColorPop(target) {
  popTarget = target;
  var pop = document.getElementById('colorPop');
  var anchor = target === 'fore' ? document.getElementById('btnColor')
    : target === 'hilite' ? document.getElementById('btnHighlight')
    : document.querySelector('#pane-layout button');
  var r = anchor.getBoundingClientRect();
  pop.style.left = Math.min(r.left, window.innerWidth - 240) + 'px';
  pop.style.top = (r.bottom + 6) + 'px';
  var html = '';
  if (recentColors.length) {
    html += '<div class="pop-title">Récentes</div><div class="sw-grid">';
    recentColors.slice(0, 7).forEach(function (c) { html += '<div class="sw" style="background:' + c + '" onclick="applyColor(\'' + c + '\')"></div>'; });
    html += '</div>';
  }
  html += '<div class="pop-title">' + (target === 'fore' ? 'Couleur du texte' : target === 'hilite' ? 'Surlignage' : 'Couleur de page') + '</div><div class="sw-grid">';
  PALETTE.forEach(function (c) { html += '<div class="sw" style="background:' + c + '" onclick="applyColor(\'' + c + '\')"></div>'; });
  html += '</div><button class="pop-more" onclick="document.getElementById(\'popCustom\').click()">Autres couleurs…</button>';
  html += '<input type="color" id="popCustom" style="position:absolute;left:-40px;top:-40px" oninput="applyColor(this.value)">';
  pop.innerHTML = html;
  pop.classList.remove('hidden');
}
function applyColor(c) {
  if (recentColors.indexOf(c) === -1) { recentColors.unshift(c); recentColors = recentColors.slice(0, 7); }
  if (popTarget === 'fore') {
    restoreSelection();
    cmd('foreColor', c);

/* ================= Règles graduées ================= */
var PX_PER_CM = 37.8;

function pageHeight() { return landscape ? 794 : 1123; }

function drawRulers() {
  var canvas = document.getElementById('rulerCanvas');
  var vr = document.getElementById('vruler');
  canvas.innerHTML = '';
  vr.innerHTML = '';
  var width = pageWidth();
  var height = pageHeight();
  var left = currentMargins, right = width - currentMargins;
  var html = '';
  for (var x = 0; x <= width; x += PX_PER_CM / 2) {
    var isCm = Math.round(x / PX_PER_CM) === (x / PX_PER_CM);
    if (x >= left && x <= right) {
      html += '<div class="rtick' + (isCm ? ' major' : '') + '" style="left:' + Math.round(x) + 'px"></div>';
      if (isCm) html += '<div class="rlabel" style="left:' + Math.round(x) + 'px">' + Math.round(x / PX_PER_CM) + '</div>';
    }
  }
  html += '<div class="rhandle" id="mLeft" title="Marge gauche" style="left:' + (left - 4) + 'px"><div class="grip"></div></div>';
  html += '<div class="rhandle" id="mRight" title="Marge droite" style="left:' + (right - 4) + 'px"><div class="grip"></div></div>';
  html += '<div class="rhandle indent" id="mIndent" title="Retrait de première ligne (paragraphe actif)" style="left:' + (left - 4) + 'px"></div>';
  canvas.innerHTML = html;
  var vhtml = '';
  for (var y = 0; y <= height; y += PX_PER_CM / 2) {
    var isCmY = Math.round(y / PX_PER_CM) === (y / PX_PER_CM);
    if (y >= currentMargins && y <= height - currentMargins) {
      vhtml += '<div class="vtick' + (isCmY ? ' major' : '') + '" style="top:' + Math.round(y) + 'px"></div>';
      if (isCmY) vhtml += '<div class="vlabel" style="top:' + Math.round(y) + 'px">' + Math.round(y / PX_PER_CM) + '</div>';
    }
  }
  vr.innerHTML = vhtml;
  vr.style.height = height + 'px';
  attachHandle(document.getElementById('mLeft'), function (dx) {
    currentMargins = Math.max(20, Math.min(currentMargins + dx, (pageWidth() / 2) - 60));
    page.style.padding = currentMargins + 'px ' + currentMargins + 'px';
    markDirty();
  });
  attachHandle(document.getElementById('mRight'), function (dx) {
    currentMargins = Math.max(20, Math.min(currentMargins - dx, (pageWidth() / 2) - 60));
    page.style.padding = currentMargins + 'px ' + currentMargins + 'px';
    markDirty();
  });
  attachHandle(document.getElementById('mIndent'), function (dx) { applyFirstLineIndent(dx); });
}
function applyFirstLineIndent(dx) {
  var sel = window.getSelection();
  if (!sel.rangeCount) return;
  var node = sel.anchorNode;
  var el = node ? (node.nodeType === 1 ? node : node.parentNode) : null;
  var p = el && el.closest ? el.closest('#page p') : null;
  if (!p) { hintFlash('Placez le curseur dans un paragraphe.'); return; }
  var current = parseFloat(p.style.textIndent) || 0;
  p.style.textIndent = Math.max(-60, Math.min(current + dx, 200)) + 'px';
  markDirty();
}
function attachHandle(el, onMove) {
  if (!el) return;
  var dragging = false, lastX = 0;
  el.addEventListener('mousedown', function (e) {
    dragging = true; lastX = e.clientX; el.classList.add('drag');
    e.preventDefault(); e.stopPropagation();
  });
  document.addEventListener('mousemove', function (e) {
    if (!dragging) return;
    var dx = e.clientX - lastX;
    lastX = e.clientX;
    onMove(dx / (parseFloat(document.body.style.zoom || '1')));
  });
  document.addEventListener('mouseup', function () {
    if (dragging) { dragging = false; el.classList.remove('drag'); drawRulers(); drawPageBoundaries(); }
  });
}

var docxRels = [];

function xmlEsc(s) {

}
function baseCtx() { return { b: false, i: false, u: false, st: false, va: null, color: null, shd: null, sz: null, font: null }; }
function cssColorToHex(v) {
  if (!v) return null;
  v = String(v).trim().toLowerCase();
  var m = v.match(/^#([0-9a-f]{3})$/);
  if (m) return m[1][0] + m[1][0] + m[1][1] + m[1][1] + m[1][2] + m[1][2];
  m = v.match(/^#([0-9a-f]{6})/);
  if (m) return m[1];
  m = v.match(/^rgba?\(\s*(\d+)[,\s]+(\d+)[,\s]+(\d+)/);
  if (m) {
    function h2(n) { var h = parseInt(n, 10).toString(16); return h.length === 1 ? '0' + h : h; }
    return h2(m[1]) + h2(m[2]) + h2(m[3]);
  }
  return null;
}
function cssSizeToHalfPt(v) {
  if (!v) return null;
  var m = v.match(/^([\d.]+)pt/);
  if (m) return String(Math.round(parseFloat(m[1]) * 2));
  m = v.match(/^([\d.]+)px/);
  if (m) return String(Math.round(parseFloat(m[1]) * 1.5));

}
function makeRun(text, c) {

  if (c.b) rpr += '<w:b/>';
  if (c.i) rpr += '<w:i/>';
  if (c.u) rpr += '<w:u w:val="single"/>';
  if (c.st) rpr += '<w:strike/>';
  if (c.color) rpr += '<w:color w:val="' + c.color.toUpperCase() + '"/>';
  if (c.shd) rpr += '<w:shd w:val="clear" w:color="auto" w:fill="' + c.shd.toUpperCase() + '"/>';
  if (c.sz) rpr += '<w:sz w:val="' + c.sz + '"/><w:szCs w:val="' + c.sz + '"/>';
  if (c.va) rpr += '<w:vertAlign w:val="' + c.va + '"/>';
