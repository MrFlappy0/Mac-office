name: Release

on:
  push:
    branches: [main]
    paths: ['VERSION', 'Sources/**', 'Resources/**', 'Package.swift', 'build.sh']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construire Paper.app et le DMG
        run: ./build.sh

      - name: Publier la release avec le DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          TAG="v${VERSION}"
          NOTES=$(mktemp)
          {
            echo "Paper ${VERSION} — traitement de texte 100 % natif pour macOS."
            echo ""
            echo "Nouveautés : refonte complète en Swift natif (AppKit), extension choisie à l'enregistrement (défaut Word .docx), menu Réglages, plan de navigation, pipeline Swift Package Manager."
            echo ""
            echo "Installation : ouvrez le DMG, faites glisser Paper.app dans Applications. Au premier lancement, si macOS bloque l'application (absence de signature de développeur), faites clic droit puis Ouvrir."
          } > "$NOTES"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "Paper-${VERSION}.dmg" --clobber || \
              gh release create "$TAG" "Paper-${VERSION}.dmg" --title "Paper ${VERSION}" --notes-file "$NOTES"
          else
            git tag "$TAG"
            git push origin "$TAG"
            gh release create "$TAG" "Paper-${VERSION}.dmg" --title "Paper ${VERSION}" --notes-file "$NOTES"
          fi
