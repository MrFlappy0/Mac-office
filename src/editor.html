<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Paper</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif; background: #f5f5f7; display: flex; flex-direction: column; overflow: hidden; -webkit-font-smoothing: antialiased; color: #1d1d1f; }

/* ---- Barre d'outils ---- */
#toolbar { background: #f6f6f8; border-bottom: 1px solid #e3e3e8; padding: 7px 12px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
#toolbar .group { display: flex; gap: 3px; align-items: center; padding-right: 10px; margin-right: 6px; border-right: 1px solid #e3e3e8; }
#toolbar .group:last-child { border-right: none; margin-right: 0; padding-right: 0; }
#toolbar button { min-width: 28px; height: 27px; padding: 0 7px; background: #fff; border: 1px solid #d2d2d8; border-radius: 6px; font-size: 12.5px; color: #333; cursor: pointer; line-height: 1; display: inline-flex; align-items: center; justify-content: center; gap: 5px; }
#toolbar button:hover { background: #eef0f4; border-color: #b8b8c0; }
#toolbar button.active { background: rgba(10,102,194,.13); border-color: rgba(10,102,194,.45); color: #0a4bbd; }
#toolbar button.tbtn-blue { color: #0a66c2; }
#toolbar select { height: 27px; border: 1px solid #d2d2d8; border-radius: 6px; background: #fff; font-size: 12.5px; padding: 0 4px; max-width: 132px; color: #333; }
#toolbar select:hover { border-color: #b8b8c0; }
#toolbar button svg { display: block; }

.seg { display: flex; background: #fff; border: 1px solid #d2d2d8; border-radius: 7px; overflow: hidden; }
.seg button { border: none; border-radius: 0; border-right: 1px solid #d2d2d8; }
.seg button:last-child { border-right: none; }
.seg button:hover { background: #eef0f4; }
.seg button.active { background: rgba(10,102,194,.13); color: #0a4bbd; }

label.color-well { position: relative; overflow: hidden; width: 29px; height: 27px; background: #fff; border: 1px solid #d2d2d8; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
label.color-well:hover { background: #eef0f4; }
label.color-well input { position: absolute; left: -30px; top: -30px; }
.swatch { width: 15px; height: 15px; border: 1px solid #999; border-radius: 4px; }

/* ---- Barre contextuelle tableaux ---- */
#tablebar { display: none; gap: 5px; padding: 6px 12px; background: #eef2f8; border-bottom: 1px solid #d5ddec; align-items: center; flex-wrap: wrap; }
#tablebar.visible { display: flex; }
#tablebar span.lbl { font-size: 11.5px; color: #0a66c2; font-weight: 700; margin-right: 6px; text-transform: uppercase; letter-spacing: .4px; }
#tablebar button { height: 24px; padding: 0 9px; font-size: 12px; border: 1px solid #b9c6e0; border-radius: 6px; background: #fff; color: #24466e; cursor: pointer; }
#tablebar button:hover { background: #dce6f8; }
#tablebar button.danger { color: #c23b3b; border-color: #ddb9b9; }
#tablebar button.danger:hover { background: #f7dede; }

/* ---- Recherche (carte flottante) ---- */
#findbar { display: none; position: absolute; top: 12px; right: 14px; z-index: 40; gap: 6px; padding: 9px 11px; background: rgba(255,255,255,.97); border: 1px solid #d8d8de; border-radius: 11px; box-shadow: 0 6px 24px rgba(0,0,0,.14); align-items: center; }
#findbar.visible { display: flex; }
#findbar input { height: 25px; border: 1px solid #d2d2d8; border-radius: 6px; padding: 0 7px; width: 160px; font-size: 12.5px; outline: none; }
#findbar input:focus { border-color: #0a66c2; box-shadow: 0 0 0 3px rgba(10,102,194,.15); }
#findbar button { height: 25px; padding: 0 9px; font-size: 12px; border: 1px solid #d2d2d8; border-radius: 6px; background: #fff; color: #333; cursor: pointer; }
#findbar button:hover { background: #eef0f4; }
#findbar button.primary { background: #0a66c2; border-color: #0a66c2; color: #fff; }
#findbar button.primary:hover { background: #0b74dd; }

/* ---- Zone principale ---- */
#mainrow { flex: 1; display: flex; min-height: 0; position: relative; }
#sidebar { width: 232px; background: #fafafc; border-right: 1px solid #e6e6ec; overflow-y: auto; padding: 12px 0 16px; }
body.no-outline #sidebar { display: none; }
.sb-title { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: #86868b; padding: 2px 16px 8px; font-weight: 700; }
.ol-item { padding: 6px 16px; font-size: 12.5px; color: #1d1d1f; cursor: pointer; border-left: 2.5px solid transparent; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ol-item:hover { background: #e8e8ee; border-left-color: #0a66c2; }
.ol-h1 { font-weight: 600; }
.ol-h2 { padding-left: 28px; color: #444; }
.ol-h3 { padding-left: 40px; color: #666; }
.ol-empty { padding: 8px 16px; font-size: 12px; color: #a1a1a6; line-height: 1.45; }

#scroll { flex: 1; overflow: auto; padding: 26px 0 44px; }
#page { background: #fff; width: 794px; min-height: 1000px; margin: 0 auto; padding: 94px 94px; box-shadow: 0 1px 4px rgba(0,0,0,.16), 0 8px 28px rgba(0,0,0,.06); outline: none; font-family: "Times New Roman", Times, serif; font-size: 12pt; line-height: 1.45; color: #111; }
#page p { margin: 0 0 10px; }
#page h1 { font-size: 28pt; margin: 14pt 0 8pt; line-height: 1.2; color: #1d1d1f; }
#page h2 { font-size: 20pt; margin: 12pt 0 7pt; line-height: 1.2; color: #1d1d1f; }
#page h3 { font-size: 15pt; margin: 10pt 0 6pt; line-height: 1.2; }
#page blockquote { border-left: 3px solid #0a66c2; background: #f5f7fa; padding: 8px 12px; color: #444; margin: 8px 0; border-radius: 0 5px 5px 0; }
#page pre { font-family: Menlo, monospace; background: #f4f4f6; padding: 8px; border-radius: 6px; margin: 8px 0; white-space: pre-wrap; }
#page ul, #page ol { padding-left: 26px; margin: 0 0 10px; }
#page table { border-collapse: collapse; margin: 10px 0; width: 100%; }
#page td, #page th { border: 1px solid #999; padding: 5px 8px; min-width: 40px; }
#page th { background: #eef0f4; font-weight: 700; }
#page img { max-width: 100%; }
#page hr { border: none; border-top: 1px solid #aaa; margin: 14px 0; }
#page a { color: #0a66c2; }

/* ---- Barre d'état ---- */
#statusbar { background: #f6f6f8; border-top: 1px solid #e3e3e8; padding: 5px 14px; font-size: 11.5px; color: #86868b; display: flex; gap: 14px; align-items: center; }
#statusbar #hint { color: #0a66c2; font-weight: 500; min-width: 1px; }
#statusbar .spacer { flex: 1; }
#statusbar .counts { display: flex; gap: 14px; }
#statusbar select { height: 20px; font-size: 11.5px; border: 1px solid #d2d2d8; border-radius: 5px; background: #fff; color: #555; }

/* ---- Dialogs ---- */
#overlay { position: fixed; inset: 0; background: rgba(30,34,45,.4); display: flex; align-items: center; justify-content: center; z-index: 60; }
#overlay.hidden { display: none; }
#dialog { background: #fff; border-radius: 12px; padding: 20px 22px; width: 470px; max-width: 90vw; max-height: 70vh; overflow: auto; box-shadow: 0 16px 48px rgba(0,0,0,.3); }
#dialog h3 { font-size: 15px; margin-bottom: 14px; color: #1d1d1f; }
.sym-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
.sym { height: 34px; font-size: 16px; border: 1px solid #dcdce2; border-radius: 7px; background: #fff; cursor: pointer; }
.sym:hover { background: #e8f0fe; border-color: #7aa5e8; }
.keys { border-collapse: collapse; width: 100%; }
.keys td { padding: 5px 10px 5px 0; font-size: 12.5px; color: #333; }
.keys td:first-child { font-weight: 600; color: #0a66c2; white-space: nowrap; width: 150px; }
.keys tr { border-bottom: 1px solid #f0f0f4; }
.dlg-close { margin-top: 16px; height: 29px; padding: 0 18px; font-size: 12.5px; border: 1px solid #d2d2d8; border-radius: 7px; background: #f4f5f9; color: #333; cursor: pointer; }
.dlg-close:hover { background: #e8e9ef; }

/* ---- Mode export PDF ---- */
body.pdf-mode { background: #fff; }
body.pdf-mode #toolbar, body.pdf-mode #tablebar, body.pdf-mode #findbar, body.pdf-mode #statusbar { display: none !important; }
body.pdf-mode #mainrow { display: block; overflow: visible; }
body.pdf-mode #sidebar { display: none; }
body.pdf-mode #scroll { overflow: visible; padding: 0; }
body.pdf-mode #page { box-shadow: none; }
</style>
</head>
<body>

<div id="toolbar">
  <div class="group">
    <button id="outlineBtn" title="Afficher ou masquer le plan du document" onclick="toggleOutline()"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><line x1="9.5" y1="4" x2="9.5" y2="20"/></svg></button>
    <button title="Annuler (Cmd+Z)" onclick="cmd('undo')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg></button>
    <button title="Rétablir (Cmd+Maj+Z)" onclick="cmd('redo')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 14 20 9 15 4"/><path d="M4 20v-7a4 4 0 0 1 4-4h12"/></svg></button>
  </div>
  <div class="group">
    <select id="blockSel" title="Style de paragraphe" onchange="restoreSelection(); applyBlock(this.value)">
      <option value="p">Corps de texte</option>
      <option value="h1">Titre 1</option>
      <option value="h2">Titre 2</option>
      <option value="h3">Titre 3</option>
      <option value="blockquote">Citation</option>
      <option value="pre">Code</option>
    </select>
    <select id="fontSel" title="Police" onchange="restoreSelection(); cmd('fontName', this.value)">
      <option value="Times New Roman">Times New Roman</option>
      <option value="Helvetica">Helvetica</option>
      <option value="Arial">Arial</option>
      <option value="Verdana">Verdana</option>
      <option value="Georgia">Georgia</option>
      <option value="Palatino">Palatino</option>
      <option value="Optima">Optima</option>
      <option value="Courier New">Courier</option>
      <option value="Menlo">Menlo</option>
      <option value="Impact">Impact</option>
      <option value="Comic Sans MS">Comic Sans MS</option>
    </select>
    <select id="sizeSel" title="Taille de police" onchange="setFontSize(this.value)">
      <option value="8">8 pt</option>
      <option value="10">10 pt</option>
      <option value="12" selected>12 pt</option>
      <option value="14">14 pt</option>
      <option value="18">18 pt</option>
      <option value="24">24 pt</option>
      <option value="36">36 pt</option>
      <option value="48">48 pt</option>
      <option value="72">72 pt</option>
    </select>
    <select id="lineSel" title="Interligne" onchange="setLineHeight(this.value)">
      <option value="1.15">Interligne : compact</option>
      <option value="1.45" selected>Interligne : normal</option>
      <option value="1.8">Interligne : large</option>
      <option value="2.2">Interligne : très large</option>
    </select>
  </div>
  <div class="group">
    <button id="btnBold" data-cmd="bold" title="Gras (Cmd+B)" onclick="cmd('bold')"><b>G</b></button>
    <button id="btnItalic" data-cmd="italic" title="Italique (Cmd+I)" onclick="cmd('italic')"><i>I</i></button>
    <button id="btnUnderline" data-cmd="underline" title="Souligné (Cmd+U)" onclick="cmd('underline')"><span style="text-decoration:underline">S</span></button>
    <button id="btnStrike" data-cmd="strikeThrough" title="Barré" onclick="cmd('strikeThrough')"><span style="text-decoration:line-through">S</span></button>
    <button data-cmd="superscript" title="Exposant" onclick="cmd('superscript')">x<sup>2</sup></button>
    <button data-cmd="subscript" title="Indice" onclick="cmd('subscript')">x<sub>2</sub></button>
  </div>
  <div class="group">
    <label class="color-well" title="Couleur du texte">
      <span class="swatch" id="foreSwatch" style="background:#111111"></span>
      <input type="color" id="foreInput" value="#111111" oninput="applyForeColor(this.value)">
    </label>
    <label class="color-well" title="Surlignage">
      <span class="swatch" id="hiliteSwatch" style="background:#ffe066"></span>
      <input type="color" id="hiliteInput" value="#ffe066" oninput="applyHilite(this.value)">
    </label>
  </div>
  <div class="group">
    <div class="seg" title="Alignement">
      <button data-cmd="justifyLeft" title="Aligner à gauche" onclick="cmd('justifyLeft')"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="17" y1="10" x2="3" y2="10"/><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="17" y1="18" x2="3" y2="18"/></svg></button>
      <button data-cmd="justifyCenter" title="Centrer" onclick="cmd('justifyCenter')"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="10" x2="6" y2="10"/><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="18" y1="18" x2="6" y2="18"/></svg></button>
      <button data-cmd="justifyRight" title="Aligner à droite" onclick="cmd('justifyRight')"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="21" y1="10" x2="7" y2="10"/><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="21" y1="18" x2="7" y2="18"/></svg></button>
      <button data-cmd="justifyFull" title="Justifier" onclick="cmd('justifyFull')"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="21" y1="10" x2="3" y2="10"/><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="21" y1="18" x2="3" y2="18"/></svg></button>
    </div>
    <div class="seg" title="Listes">
      <button data-cmd="insertUnorderedList" title="Liste à puces" onclick="cmd('insertUnorderedList')"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></button>
      <button data-cmd="insertOrderedList" title="Liste numérotée" onclick="cmd('insertOrderedList')"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="10" y1="6" x2="21" y2="6"/><line x1="10" y1="12" x2="21" y2="12"/><line x1="10" y1="18" x2="21" y2="18"/><path d="M4 6h1v4"/><path d="M4 10h2"/><path d="M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"/></svg></button>
    </div>
    <button title="Diminuer le retrait" onclick="cmd('outdent')"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 3 12 9 6"/><line x1="3" y1="12" x2="13" y2="12"/><line x1="17" y1="6" x2="21" y2="6"/><line x1="17" y1="12" x2="21" y2="12"/><line x1="17" y1="18" x2="21" y2="18"/></svg></button>
    <button title="Augmenter le retrait" onclick="cmd('indent')"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 21 12 15 6"/><line x1="11" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="7" y2="6"/><line x1="3" y1="12" x2="7" y2="12"/><line x1="3" y1="18" x2="7" y2="18"/></svg></button>
  </div>
  <div class="group">
    <button title="Insérer un lien" onclick="insertLink()">Lien</button>
    <button title="Insérer une image" onclick="native({type:'image'})">Image</button>
    <button title="Insérer un tableau" onclick="insertTable()">Tableau</button>
    <button title="Caractères spéciaux" onclick="openDialog('symbols')">Symboles</button>
    <button title="Insérer la date du jour" onclick="insertDate()">Date</button>
    <button title="Page de garde" onclick="insertCover()">Page de garde</button>
    <button title="Ligne horizontale" onclick="cmd('insertHorizontalRule')">Ligne</button>
  </div>
  <div class="group">
    <button title="Effacer la mise en forme" onclick="cmd('removeFormat')">Effacer</button>
    <button title="Rechercher et remplacer (Cmd+F)" onclick="toggleFind(true)">Rechercher</button>
  </div>
  <div class="group">
    <button title="Nouveau document (Cmd+N)" onclick="newDoc()">Nouveau</button>
    <button title="Ouvrir (Cmd+O)" onclick="native({type:'open'})">Ouvrir</button>
    <button class="tbtn-blue" title="Enregistrer en HTML (Cmd+S)" onclick="requestSave('html')">Enregistrer</button>
    <button class="tbtn-blue" title="Enregistrer au format Word (.doc) (Cmd+Maj+S)" onclick="requestSave('doc')">Word</button>
    <button class="tbtn-blue" title="Exporter en PDF (Cmd+E)" onclick="native({type:'pdf'})">PDF</button>
    <button title="Imprimer (Cmd+P)" onclick="native({type:'print'})"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 3 18 3 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="7"/></svg></button>
  </div>
</div>

<div id="tablebar">
  <span class="lbl">Tableau</span>
  <button onclick="tableAddRow(true)">Ligne au-dessus</button>
  <button onclick="tableAddRow(false)">Ligne en dessous</button>
  <button onclick="tableAddCol(true)">Colonne avant</button>
  <button onclick="tableAddCol(false)">Colonne après</button>
  <button onclick="tableToggleHeader()">En-tête</button>
  <button class="danger" onclick="tableDelRow()">Suppr. ligne</button>
  <button class="danger" onclick="tableDelCol()">Suppr. colonne</button>
  <button class="danger" onclick="tableDelTable()">Suppr. tableau</button>
</div>

<div id="findbar">
  <input id="findInput" placeholder="Rechercher" onkeydown="handleFindKey(event)">
  <input id="replaceInput" placeholder="Remplacer par" onkeydown="handleFindKey(event)">
  <button onclick="findNext()">Suivant</button>
  <button onclick="replaceOne()">Remplacer</button>
  <button onclick="replaceAll()">Tout</button>
  <button class="primary" onclick="toggleFind(false)">Fermer</button>
</div>

<div id="mainrow">
  <div id="sidebar">
    <div class="sb-title">Plan du document</div>
    <div id="outline"></div>
  </div>
  <div id="scroll">
    <div id="page" contenteditable="true" spellcheck="true"><p><br></p></div>
  </div>
</div>

<div id="statusbar">
  <span id="hint"></span>
  <span class="spacer"></span>
  <span class="counts">
    <span id="countWords">0 mot</span>
    <span id="countChars">0 caractère</span>
    <span id="readTime"></span>
  </span>
  <span class="spacer"></span>
  <span>A4 · 2,5 cm</span>
  <select id="zoomSel" onchange="setZoom(this.value)" title="Zoom">
    <option value="0.75">75 %</option>
    <option value="1" selected>100 %</option>
    <option value="1.25">125 %</option>
    <option value="1.5">150 %</option>
    <option value="2">200 %</option>
  </select>
</div>

<div id="overlay" class="hidden"><div id="dialog"></div></div>

<script>
var page = document.getElementById('page');
var findbar = document.getElementById('findbar');
var savedRange = null;
var dirty = false;
var savedZoom = '1';
var ZOOMS = [0.75, 1, 1.25, 1.5, 2];
var plainPaste = false;

function native(obj) {
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.app) {
    window.webkit.messageHandlers.app.postMessage(obj);
  }
}

function cmd(c, v) {
  page.focus();
  document.execCommand(c, false, (v === undefined ? null : v));
  refresh();
}

function refresh() {
  syncToolbar();
  syncTableBar();
  refreshCounts();
  buildOutline();
}

document.addEventListener('selectionchange', function () {
  var s = window.getSelection();
  if (s.rangeCount > 0 && page.contains(s.getRangeAt(0).commonAncestorContainer)) {
    savedRange = s.getRangeAt(0).cloneRange();
  }
  syncToolbar();
  syncTableBar();
});

document.querySelectorAll('#toolbar button, #tablebar button, .seg button').forEach(function (b) {
  b.addEventListener('mousedown', function (e) { e.preventDefault(); });
});

function restoreSelection() {
  page.focus();
  if (savedRange) {
    var s = window.getSelection();
    s.removeAllRanges();
    s.addRange(savedRange);
  }
}

function state(c) {
  try { return document.queryCommandState(c); } catch (e) { return false; }
}

function syncToolbar() {
  document.querySelectorAll('#toolbar button[data-cmd]').forEach(function (b) {
    b.classList.toggle('active', state(b.getAttribute('data-cmd')));
  });
  var sel = document.getElementById('blockSel');
  var cur = '';
  try { cur = (document.queryCommandValue('formatBlock') || '').replace(/[<>]/g, '').toLowerCase(); } catch (e) {}
  if (!cur) cur = 'p';
  if (sel.querySelector('option[value="' + cur + '"]')) sel.value = cur;
}

/* ---- Compteurs ---- */

function refreshCounts() {
  var t = page.innerText.replace(/\u00a0/g, ' ').trim();
  var words = t ? t.split(/\s+/).length : 0;
  document.getElementById('countWords').textContent = words + (words > 1 ? ' mots' : ' mot');
  document.getElementById('countChars').textContent = t.length + (t.length > 1 ? ' caractères' : ' caractère');
  document.getElementById('readTime').textContent = words > 150 ? '· environ ' + Math.ceil(words / 200) + ' min de lecture' : '';
}

/* ---- Barre d'état : messages ---- */

function hint(msg) {
  var el = document.getElementById('hint');
  el.textContent = msg;
  if (hint.timer) clearTimeout(hint.timer);
  hint.timer = setTimeout(function () { el.textContent = ''; }, 8000);
}

/* ---- État modifié ---- */

function setDirty(d) {
  if (d === dirty) return;
  dirty = d;
  native({ type: 'dirty', value: d });
}

page.addEventListener('input', function () {
  setDirty(true);
  refresh();
});

function afterSave() {
  dirty = false;
  try { localStorage.removeItem('paper.autosave'); } catch (e) {}
  hint('Document enregistré.');
}

function newDoc() {
  if (dirty && !window.confirm('Le document contient des modifications non enregistrées. Continuer sans enregistrer ?')) return;
  page.innerHTML = '<p><br></p>';
  dirty = false;
  try { localStorage.removeItem('paper.autosave'); } catch (e) {}
  native({ type: 'new' });
  refresh();
}

function openHTML(html) {
  var doc = new DOMParser().parseFromString(html, 'text/html');
  page.innerHTML = doc.body.innerHTML || '<p><br></p>';
  dirty = false;
  try { localStorage.removeItem('paper.autosave'); } catch (e) {}
  refresh();
}

function openText(text) {
  var blocks = text.split(/\n\s*\n/);
  var html = '';
  for (var i = 0; i < blocks.length; i++) {
    var esc = blocks[i].replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>');
    html += '<p>' + (esc || '<br>') + '</p>';
  }
  page.innerHTML = html || '<p><br></p>';
  dirty = false;
  try { localStorage.removeItem('paper.autosave'); } catch (e) {}
  refresh();
}

/* ---- Sauvegarde automatique ---- */

setInterval(function () {
  try { if (dirty) localStorage.setItem('paper.autosave', page.innerHTML); } catch (e) {}
}, 4000);

try {
  var backup = localStorage.getItem('paper.autosave');
  if (backup && backup.replace(/<[^>]*>/g, '').replace(/&nbsp;/g, ' ').trim() !== '') {
    if (window.confirm('Une version non enregistrée de votre dernier document a été retrouvée. Voulez-vous la restaurer ?')) {
      page.innerHTML = backup;
      setDirty(true);
    } else {
      localStorage.removeItem('paper.autosave');
    }
  }
} catch (e) {}

/* ---- Collage sans mise en forme ---- */

document.addEventListener('paste', function (e) {
  if (!plainPaste) return;
  e.preventDefault();
  var text = (e.clipboardData || window.clipboardData).getData('text/plain');
  document.execCommand('insertText', false, text);
  plainPaste = false;
  hint('Collage sans mise en forme effectué.');
  refresh();
});

function pastePlain() {
  plainPaste = true;
  page.focus();
  hint('Mode texte seul actif : collez avec Cmd+V.');
}

/* ---- Insertions ---- */

function insertImage(dataUrl) {
  restoreSelection();
  document.execCommand('insertHTML', false, '<img src="' + dataUrl + '">');
  setDirty(true);
  refresh();
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function escapeAttr(s) {
  return escapeHtml(s).replace(/"/g, '&quot;');
}

function insertLink() {
  restoreSelection();
  var sel = window.getSelection().toString();
  var url = window.prompt('Adresse du lien :', 'https://');
  if (!url) return;
  if (sel) {
    document.execCommand('createLink', false, url);
  } else {
    document.execCommand('insertHTML', false, '<a href="' + escapeAttr(url) + '">' + escapeHtml(url) + '</a>');
  }
  setDirty(true);
  refresh();
}

function insertTable() {
  restoreSelection();
  var r = parseInt(window.prompt('Nombre de lignes :', '3'), 10);
  if (!r || r < 1) return;
  var c = parseInt(window.prompt('Nombre de colonnes :', '3'), 10);
  if (!c || c < 1) return;
  var html = '<table><tbody>';
  for (var i = 0; i < r; i++) {
    html += '<tr>';
    for (var j = 0; j < c; j++) html += '<td>&nbsp;</td>';
    html += '</tr>';
  }
  html += '</tbody></table><p><br></p>';
  document.execCommand('insertHTML', false, html);
  setDirty(true);
  refresh();
}

function insertDate() {
  restoreSelection();
  var d = new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  document.execCommand('insertText', false, d);
  setDirty(true);
  refresh();
}

function insertSymbol(ch) {
  restoreSelection();
  document.execCommand('insertText', false, ch);
  setDirty(true);
  refresh();
}

function insertCover() {
  restoreSelection();
  var title = window.prompt('Titre du document :', '');
  if (title === null) return;
  var sub = window.prompt('Sous-titre (laisser vide pour ignorer) :', '');
  if (sub === null) sub = '';
  var dateStr = new Date().toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
  var html = '<div style="text-align:center; padding:190px 0 250px;">'
    + '<p style="font-size:36pt; font-weight:700; margin:0 0 20px;">' + (escapeHtml(title) || 'Titre du document') + '</p>';
  if (sub) html += '<p style="font-size:16pt; color:#555; margin:0 0 28px;">' + escapeHtml(sub) + '</p>';
  html += '<p style="font-size:12pt; color:#86868b; margin:0;">' + dateStr + '</p>';
  html += '</div><p><br></p>';
  document.execCommand('insertHTML', false, html);
  setDirty(true);
  refresh();
}

/* ---- Édition de tableaux ---- */

function caretCell() {
  var s = window.getSelection();
  if (!s.rangeCount) return null;
  var n = s.getRangeAt(0).startContainer;
  var el = (n.nodeType === 1) ? n : n.parentNode;
  if (!el || !el.closest) return null;
  return el.closest('#page td, #page th');
}

function caretTable() {
  var cell = caretCell();
  return cell ? cell.closest('table') : null;
}

function syncTableBar() {
  document.getElementById('tablebar').classList.toggle('visible', !!caretTable());
}

function tableAddRow(above) {
  var t = caretTable();
  if (!t) return;
  var cell = caretCell();
  var target = cell ? (above ? cell.parentElement.rowIndex : cell.parentElement.rowIndex + 1) : t.rows.length;
  var cols = 0;
  for (var i = 0; i < t.rows.length; i++) cols = Math.max(cols, t.rows[i].cells.length);
  var nr = t.insertRow(target);
  for (var j = 0; j < cols; j++) nr.insertCell(-1).innerHTML = '&nbsp;';
  setDirty(true);
  refresh();
}

function tableAddCol(before) {
  var t = caretTable();
  if (!t) return;
  var cell = caretCell();
  var target = cell ? (before ? cell.cellIndex : cell.cellIndex + 1) : t.rows[0].cells.length;
  for (var i = 0; i < t.rows.length; i++) {
    t.rows[i].insertCell(target).innerHTML = '&nbsp;';
  }
  setDirty(true);
  refresh();
}

function tableToggleHeader() {
  var t = caretTable();
  if (!t || !t.rows.length) return;
  var first = t.rows[0];
  var toTh = first.cells[0] && first.cells[0].tagName === 'TD';
  for (var i = 0; i < first.cells.length; i++) {
    var cell = first.cells[i];
    var newCell = document.createElement(toTh ? 'th' : 'td');
    newCell.innerHTML = cell.innerHTML;
    cell.parentNode.replaceChild(newCell, cell);
  }
  setDirty(true);
  refresh();
}

function tableDelRow() {
  var t = caretTable();
  var cell = caretCell();
  if (!t || !cell) return;
  cell.parentElement.remove();
  if (t.rows.length === 0) t.remove();
  setDirty(true);
  refresh();
}

function tableDelCol() {
  var t = caretTable();
  var cell = caretCell();
  if (!t || !cell) return;
  var idx = cell.cellIndex;
  for (var i = 0; i < t.rows.length; i++) {
    if (t.rows[i].cells[idx]) t.rows[i].deleteCell(idx);
  }
  if (t.rows[0] && t.rows[0].cells.length === 0) t.remove();
  setDirty(true);
  refresh();
}

function tableDelTable() {
  var t = caretTable();
  if (!t) return;
  t.remove();
  if (!page.firstChild) page.innerHTML = '<p><br></p>';
  setDirty(true);
  refresh();
}

/* ---- Plan du document ---- */

function buildOutline() {
  var out = document.getElementById('outline');
  var heads = page.querySelectorAll('h1, h2, h3');
  var html = '';
  for (var i = 0; i < heads.length; i++) {
    var h = heads[i];
    var txt = h.textContent.trim() || '(sans titre)';
    html += '<div class="ol-item ol-' + h.tagName.toLowerCase() + '" data-idx="' + i + '" title="' + escapeAttr(txt) + '">' + escapeHtml(txt) + '</div>';
  }
  out.innerHTML = html || '<div class="ol-empty">Aucun titre pour le moment. Utilisez les styles Titre 1 à 3 pour structurer votre document : ils apparaîtront ici.</div>';
  out.querySelectorAll('.ol-item').forEach(function (el) {
    el.onclick = function () {
      var h = page.querySelectorAll('h1, h2, h3')[parseInt(el.getAttribute('data-idx'), 10)];
      if (h) h.scrollIntoView({ behavior: 'smooth', block: 'center' });
    };
  });
}

function toggleOutline() {
  document.body.classList.toggle('no-outline');
  document.getElementById('outlineBtn').classList.toggle('active', !document.body.classList.contains('no-outline'));
  buildOutline();
}

/* ---- Mise en forme ---- */

function applyBlock(v) {
  cmd('formatBlock', '<' + v + '>');
}

function setLineHeight(v) {
  page.style.lineHeight = v;
  setDirty(true);
}

function setFontSize(size) {
  restoreSelection();
  document.execCommand('fontSize', false, '7');
  var fonts = page.querySelectorAll('font[size="7"]');
  for (var i = 0; i < fonts.length; i++) {
    var f = fonts[i];
    var span = document.createElement('span');
    span.style.fontSize = size + 'pt';
    while (f.firstChild) span.appendChild(f.firstChild);
    f.parentNode.replaceWith(span, f);
  }
  setDirty(true);
}

function applyForeColor(v) {
  restoreSelection();
  cmd('foreColor', v);
  document.getElementById('foreSwatch').style.background = v;
}

function applyHilite(v) {
  restoreSelection();
  if (!document.execCommand('hiliteColor', false, v)) {
    document.execCommand('backColor', false, v);
  }
  document.getElementById('hiliteSwatch').style.background = v;
  refresh();
}

/* ---- Enregistrement ---- */

function requestSave(ext) {
  native({ type: 'save', ext: ext, html: page.innerHTML });
}

function requestSaveText() {
  native({ type: 'saveText', text: page.innerText });
}

/* ---- Recherche et remplacement ---- */

function toggleFind(show) {
  findbar.classList.toggle('visible', show);
  if (show) {
    var i = document.getElementById('findInput');
    i.focus();
    i.select();
  } else {
    page.focus();
  }
}

function handleFindKey(e) {
  if (e.key === 'Enter') { e.preventDefault(); findNext(); }
  if (e.key === 'Escape') { e.preventDefault(); toggleFind(false); }
}

function findNext() {
  var term = document.getElementById('findInput').value;
  if (!term) return;
  if (!window.find(term, false, false, true)) {
    window.getSelection().removeAllRanges();
  }
}

function replaceOne() {
  var term = document.getElementById('findInput').value;
  var rep = document.getElementById('replaceInput').value;
  var cur = savedRange ? savedRange.toString() : '';
  if (cur && term && cur.toLowerCase() === term.toLowerCase()) {
    restoreSelection();
    document.execCommand('insertText', false, rep);
    setDirty(true);
  }
  findNext();
}

function replaceAll() {
  var term = document.getElementById('findInput').value;
  var rep = document.getElementById('replaceInput').value;
  if (!term) return;
  page.focus();
  var r = document.createRange();
  r.selectNodeContents(page);
  r.collapse(true);
  var s = window.getSelection();
  s.removeAllRanges();
  s.addRange(r);
  var n = 0;
  while (n < 2000 && window.find(term, false, false, false)) {
    document.execCommand('insertText', false, rep);
    n++;
  }
  if (n > 0) {
    setDirty(true);
    hint(n + ' remplacement' + (n > 1 ? 's' : '') + ' effectué' + (n > 1 ? 's' : '') + '.');
  }
  refresh();
}

/* ---- Zoom ---- */

function setZoom(z) {
  document.body.style.zoom = z;
  var sel = document.getElementById('zoomSel');
  var v = String(z);
  if (sel.querySelector('option[value="' + v + '"]')) sel.value = v;
}

function zoomIndex() {
  return ZOOMS.indexOf(parseFloat(document.body.style.zoom || '1'));
}

function zoomIn() {
  var i = zoomIndex();
  if (i > -1 && i < ZOOMS.length - 1) setZoom(ZOOMS[i + 1]);
}

function zoomOut() {
  var i = zoomIndex();
  if (i > 0) setZoom(ZOOMS[i - 1]);
}

function zoomReset() {
  setZoom(1);
}

/* ---- Dialogs ---- */

var SYMBOLS = ['«','»','“','”','‘','’','—','–','…','€','œ','Œ','æ','Æ','©','®','™','°','±','×','÷','²','³','½','¼','¾','§','¶','†','•','¡','¿','Á','À','Â','Ä','É','È','Ê','Ë','Í','Ì','Î','Ï','Ó','Ò','Ô','Ö','Ú','Ù','Û','Ü','Ç','Ÿ'];

function openDialog(kind) {
  var d = document.getElementById('dialog');
  var html = '';
  if (kind === 'symbols') {
    html += '<h3>Caractères spéciaux</h3><div class="sym-grid">';
    SYMBOLS.forEach(function (c) {
      html += '<button class="sym" title="Insérer ' + escapeAttr(c) + '" onclick="insertSymbol(\'' + c + '\')">' + escapeHtml(c) + '</button>';
    });
    html += '</div>';
  } else if (kind === 'shortcuts') {
    html += '<h3>Raccourcis clavier</h3><table class="keys">'
      + '<tr><td>Cmd+N</td><td>Nouveau document</td></tr>'
      + '<tr><td>Cmd+O</td><td>Ouvrir (HTML, RTF, TXT, MD)</td></tr>'
      + '<tr><td>Cmd+S</td><td>Enregistrer en HTML</td></tr>'
      + '<tr><td>Cmd+Maj+S</td><td>Enregistrer au format Word (.doc)</td></tr>'
      + '<tr><td>Cmd+E</td><td>Exporter en PDF</td></tr>'
      + '<tr><td>Cmd+P</td><td>Imprimer</td></tr>'
      + '<tr><td>Cmd+F</td><td>Rechercher et remplacer</td></tr>'
      + '<tr><td>Cmd+Z / Cmd+Maj+Z</td><td>Annuler / rétablir</td></tr>'
      + '<tr><td>Cmd+B / Cmd+I / Cmd+U</td><td>Gras / italique / souligné</td></tr>'
      + '<tr><td>Cmd+Alt+Maj+V</td><td>Coller sans mise en forme</td></tr>'
      + '<tr><td>Cmd+A</td><td>Tout sélectionner</td></tr>'
      + '<tr><td>Cmd + / Cmd -</td><td>Zoom avant / arrière</td></tr>'
      + '<tr><td>Cmd+0</td><td>Zoom 100 %</td></tr>'
      + '</table>';
  }
  html += '<button class="dlg-close" onclick="closeDialog()">Fermer</button>';
  d.innerHTML = html;
  document.getElementById('overlay').classList.remove('hidden');
}

function closeDialog() {
  document.getElementById('overlay').classList.add('hidden');
  page.focus();
}

document.getElementById('overlay').addEventListener('mousedown', function (e) {
  if (e.target === this) closeDialog();
});

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && !document.getElementById('overlay').classList.contains('hidden')) closeDialog();
});

/* ---- Mode export PDF ---- */

function enterPdfMode() {
  savedZoom = document.body.style.zoom || '1';
  document.body.style.zoom = '1';
  document.body.classList.add('pdf-mode');
  document.getElementById('scroll').scrollTop = 0;
}

function exitPdfMode() {
  document.body.classList.remove('pdf-mode');
  document.body.style.zoom = savedZoom;
}

/* ---- Initialisation ---- */

document.execCommand('defaultParagraphSeparator', false, 'p');
buildOutline();
refresh();
page.focus();
</script>
